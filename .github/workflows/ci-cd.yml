# One manual pipeline. Nothing runs on push or pull request, to save Actions minutes.
# Run:  gh workflow run ci-cd.yml -f target=test   (or infra | api | web | api-web | all)
# Release: add -f version=1.2.0 to a deploy. Once everything passed, it tags v1.2.0 and publishes a
# GitHub Release (see "Releases" in README.md).
name: ci-cd

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to run. Tests always run first.
        type: choice
        default: test
        options: [test, infra, api, web, api-web, all]
      version:
        description: Release version, MAJOR.MINOR.PATCH (e.g. 1.2.0). Empty deploys without a release.
        type: string
        default: ''

permissions:
  contents: read

# Resource names from infra/main.bicep (namePrefix in main.bicepparam).
env:
  API_APP: receipt-splitter-api
  WEB_APP: receipt-splitter-web

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # Checked before anything else, so a bad version never starts a deploy. A release is
      # MAJOR.MINOR.PATCH, from main, with a deploy target, new, and higher than the last release.
      # Without one, the build is labelled with the last release plus the commit: 1.2.0+abc1234.
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          v=${VERSION#v}
          released=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          latest=$(sort -V <<<"$released" | tail -n1)
          if [ -z "$v" ]; then
            echo "app_version=${latest:-0.0.0}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "Version must be MAJOR.MINOR.PATCH, like 1.2.0. Got: $VERSION"
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Releases run from main only."
          [[ "$TARGET" =~ ^(api|web|api-web|all)$ ]] || fail "A release needs target api, web, api-web or all."
          grep -qx "$v" <<<"$released" && fail "v$v is already released."
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n1)" != "$v" ]; then
            fail "v$v is lower than the last release, v$latest."
          fi
          echo "Releasing v$v (last release: ${latest:-none})"
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: .NET tests
        run: dotnet test --configuration Release

      - name: .NET vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web tests and build
        working-directory: web
        run: |
          npm test
          npm run build

      - name: Web audit
        working-directory: web
        run: npm audit --audit-level=high

  # Deploy jobs. Each runs only from main, needs the tests, and waits for approval on the
  # GitHub "production" environment. Azure sign-in is OIDC: no Azure password or key is stored in
  # GitHub. The Azure ids and the alert email are repository secrets only so that logs mask them.

  infra:
    needs: test
    if: contains(fromJSON('["infra", "all"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Deploys run from main only
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::Deploy from main only."; exit 1; }

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Keeps the running image (see infra/deploy.sh).
      - name: Deploy Bicep
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: infra/deploy.sh

  api:
    needs: [test, infra]
    if: >-
      always() && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.infra.result)
      && contains(fromJSON('["api", "api-web", "all"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Deploys run from main only
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::Deploy from main only."; exit 1; }

      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/receipt-splitter-api:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image is tagged with its commit. A release also tags it with its version.
      - name: Build and push
        env:
          APP_VERSION: ${{ needs.test.outputs.app_version }}
          RELEASE: ${{ needs.test.outputs.release }}
        run: |
          docker build -f src/ReceiptSplitter.Api/Dockerfile --build-arg APP_VERSION="$APP_VERSION" -t "$IMAGE" .
          docker push "$IMAGE"
          if [ "$RELEASE" = true ]; then
            docker tag "$IMAGE" "${IMAGE%:*}:$APP_VERSION"
            docker push "${IMAGE%:*}:$APP_VERSION"
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The same Bicep as infra with the new image, so port, probes, settings and roles stay in one
      # place. The image is public, so the app pulls it with no credential. The new revision takes
      # traffic only once its /healthz probe passes.
      - name: Roll out
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: infra/deploy.sh "$IMAGE"

      - name: Wait for /healthz
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          fqdn=$(az resource show -g "$RG" -n "$API_APP" --resource-type Microsoft.App/containerApps \
            --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 1 36); do
            curl -fsS "https://$fqdn/healthz" && exit 0
            sleep 5
          done
          echo "::error::https://$fqdn/healthz did not return 200"
          exit 1

  web:
    needs: [test, infra, api]
    if: >-
      always() && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.infra.result)
      && contains(fromJSON('["success", "skipped"]'), needs.api.result)
      && contains(fromJSON('["web", "api-web", "all"]'), inputs.target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Deploys run from main only
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::Deploy from main only."; exit 1; }

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The deploy token is read at run time and masked, so it is never stored as a secret.
      - name: API address and deploy token
        id: azure
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          fqdn=$(az resource show -g "$RG" -n "$API_APP" --resource-type Microsoft.App/containerApps \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)
          if [ -z "$fqdn" ]; then
            echo "::error::No API yet. Run target=api first."
            exit 1
          fi
          echo "VITE_API_BASE_URL=https://$fqdn" >> "$GITHUB_ENV"
          token=$(az staticwebapp secrets list -g "$RG" -n "$WEB_APP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ needs.test.outputs.app_version }}
        run: |
          npm ci
          npm run build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.azure.outputs.token }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

  # Runs after any deploy. Signs in with the main-branch credential, so it needs no second approval.
  smoke:
    needs: [test, infra, api, web]
    if: >-
      always() && inputs.target != 'test'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # When this run released the API, /healthz must also report this run's version.
      - name: Version, create, claim, check totals, delete
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          EXPECTED_VERSION: ${{ needs.api.result == 'success' && needs.test.outputs.app_version || '' }}
        run: |
          app=$(az resource show -g "$RG" -n "$API_APP" --resource-type Microsoft.App/containerApps -o json 2>/dev/null || true)
          image=$(jq -r '.properties.template.containers[0].image // empty' <<<"$app")
          # Before the first release the app runs a placeholder with no API (see infra/deploy.sh).
          if [ -z "$image" ] || [[ "$image" == mcr.microsoft.com/k8se/quickstart* ]]; then
            echo "No API released yet, nothing to check. Run target=api."
            exit 0
          fi
          infra/smoke.sh "https://$(jq -r .properties.configuration.ingress.fqdn <<<"$app")" "$EXPECTED_VERSION"

  # Only with a version, and only once every deploy and the smoke test passed: tags the deployed
  # commit vX.Y.Z and publishes a GitHub Release with notes from the PRs merged since the last one.
  release:
    needs: [test, infra, api, web, smoke]
    if: >-
      always() && needs.test.outputs.release == 'true' && needs.smoke.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.app_version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
