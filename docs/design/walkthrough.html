<style>
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#141A1D; --muted:#5F6B71; --line:#DCE2E5;
  --accent:#1D6F72; --accent-soft:#DDEEEE; --on-accent:#FFFFFF;
  --claim:#A86A12; --claim-soft:#FBEFD9; --warn:#B4442B; --warn-soft:#F9E3DD; --ok:#22805F; --ok-soft:#DCF1E8;
  --night:#12171A; --on-night:#EEF3F4;
  --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.9);
  --hero:linear-gradient(165deg,#173038 0%,#2A5E63 55%,#C9DCDB 100%);

  --frame:#DDE3E6; --shadow:0 24px 50px -28px rgba(20,40,50,.45);
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1315; --surface:#182024; --ink:#E9EFF1; --muted:#9AA9AF; --line:#2A3539;
  --accent:#5FC4C2; --accent-soft:#163334; --on-accent:#0F1315;
  --claim:#E8B356; --claim-soft:#3A2D15; --warn:#F08A70; --warn-soft:#3D2019; --ok:#5DD0A6; --ok-soft:#163528;
  --night:#000000; --on-night:#EEF3F4;
  --glass:rgba(32,42,46,.78); --glass-line:rgba(255,255,255,.08);
  --hero:linear-gradient(165deg,#10252B 0%,#22545A 55%,#1A2A2E 100%);
  --screen:linear-gradient(170deg,#1A2226 0%,#12181B 45%,#182024 100%);
  --frame:#232D31; --shadow:0 24px 50px -28px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1315; --surface:#182024; --ink:#E9EFF1; --muted:#9AA9AF; --line:#2A3539;
  --accent:#5FC4C2; --accent-soft:#163334; --on-accent:#0F1315;
  --claim:#E8B356; --claim-soft:#3A2D15; --warn:#F08A70; --warn-soft:#3D2019; --ok:#5DD0A6; --ok-soft:#163528;

/* ---------- Mockups ---------- */
.rail{display:flex;gap:28px;overflow-x:auto;padding:8px 4px 24px;scroll-snap-type:x mandatory}
.shot{flex:0 0 auto;display:flex;flex-direction:column;gap:12px;scroll-snap-align:start;width:300px;max-width:100%}
.shot figcaption{font-size:13px;color:var(--muted)}
.shot figcaption b{color:var(--ink);font-weight:600}
figure{margin:0}
.phone{width:300px;max-width:100%;height:630px;background:var(--frame);border-radius:44px;padding:8px;box-shadow:var(--shadow)}
.scr{height:100%;border-radius:37px;background:var(--screen);overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font:600 11px var(--f-body);color:var(--ink);position:relative;z-index:1}
.hero .sbar{color:var(--on-accent)}
.hero .sbar{color:#fff}
.hero{background:var(--hero);border-radius:0 0 34px 34px;padding-bottom:18px;color:#fff;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.hero .ttl{font:500 14px var(--f-display);opacity:.92;margin-top:4px}
.hero .big{font:700 30px/1.1 var(--f-display);letter-spacing:-.02em}
.hero .sub{font-size:11px;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 16px 0}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line);color:var(--ink)}
.ib svg{width:16px;height:16px}
.ibs{display:flex;gap:0;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:2px}
.ibs .ib{border:0;background:transparent}
.body{flex:1;overflow:hidden;padding:12px 14px 0;display:flex;flex-direction:column;gap:10px}
.h{font:700 15px var(--f-display);letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.h small{font:500 11px var(--f-body);color:var(--muted)}
.pillcard{background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 24px -18px rgba(20,40,50,.5)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.amt{font:600 13px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono)}
.small{font-size:11px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 14px;font:600 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.ghost{background:var(--glass);border-color:var(--glass-line)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:500;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.chip.me{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.open{background:var(--claim-soft);color:var(--claim);border-color:transparent}
.chip.flag{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:700 11px var(--f-display);color:#fff;flex:0 0 auto;border:2px solid var(--surface);background:linear-gradient(135deg,#4A6A7A,#8FA9B5)}
.av.lg{width:40px;height:40px;font-size:14px}
.av.c1{background:linear-gradient(135deg,#2A5E63,#6FA5A3)}.av.c2{background:linear-gradient(135deg,#D27D6B,#EDB58F)}
.av.c3{background:linear-gradient(135deg,#3F8C88,#86C7B3)}.av.c4{background:linear-gradient(135deg,#4F6FB8,#93AEE6)}
.av.c5{background:linear-gradient(135deg,#9A5A3C,#D39A72)}.av.c6{background:linear-gradient(135deg,#8A7A3C,#CFBE78)}
.av.c7{background:linear-gradient(135deg,#5E5A76,#A29DBE)}
.av.add{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.avs{display:flex}.avs .av{margin-left:-9px}.avs .av:first-child{margin-left:0}
.hero .avs .av{border-color:rgba(255,255,255,.85)}
.night{background:var(--night);color:var(--on-night);border-radius:26px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.night .small{color:var(--on-night);opacity:.7}
.duo{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.grad{background:var(--hero);color:#fff;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:6px}
.grad .btn{background:rgba(255,255,255,.92);border:0;color:#173038;align-self:flex-start;padding:6px 12px;font-size:11px}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#3E8E8E,#1D5F63);color:#fff;box-shadow:0 8px 18px -8px rgba(15,60,62,.6);flex:0 0 auto}
.round svg{width:20px;height:20px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;padding:12px 6px;font-size:11px;font-weight:600}
.act .round{width:36px;height:36px}.act .round svg{width:16px;height:16px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase}
.line.flagged{background:var(--warn-soft);margin:0 -14px;padding:7px 14px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.slide{margin:auto 12px 14px;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:0 12px 24px -16px rgba(20,40,50,.55)}
.slide b{flex:1;text-align:center;font:600 14px var(--f-display)}
.slide .chev{color:var(--muted);letter-spacing:-2px;font-weight:700}
.dock{position:absolute;left:10px;right:10px;bottom:10px;background:var(--night);color:var(--on-night);border-radius:999px;padding:8px 8px 8px 18px;display:flex;justify-content:space-between;align-items:center}
.dock .amt{font-size:17px}
.dock .small{color:var(--on-night);opacity:.7}
.qr{width:64px;height:64px;border-radius:12px;flex:0 0 auto;background:
  repeating-linear-gradient(90deg,var(--night) 0 5px,transparent 5px 9px),
  repeating-linear-gradient(0deg,var(--night) 0 4px,transparent 4px 10px);border:5px solid #fff;background-color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:30px 30px 0 0;padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 30px -12px rgba(10,20,25,.35)}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
.scrim{position:absolute;inset:0;background:rgba(10,20,25,.4)}
.tot{border-top:1px solid var(--ink);padding-top:8px}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface)}
.toggle.on{background:var(--ok)}.toggle.on::after{left:17px}
.input{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px;color:var(--muted)}
.input>span:first-child{flex:1}
.people{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 2px;justify-items:center}
.people .p{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:3px;font-size:11px;font-weight:600;text-align:center}
.seg span{padding:7px;border-radius:999px;color:var(--muted)}.seg .on{background:var(--night);color:var(--on-night)}
.sliders{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-items:center;padding-top:4px}
.sl{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;font-weight:600}
.track{width:6px;height:140px;border-radius:999px;background:var(--line);position:relative}
.track i{position:absolute;left:0;right:0;bottom:0;border-radius:inherit;background:var(--accent)}
.track b{position:absolute;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.desk{border:1px solid var(--line);border-radius:28px;background:var(--screen);overflow:hidden;min-width:900px;box-shadow:var(--shadow)}
.desk .chrome{display:flex;gap:6px;padding:12px 18px;border-bottom:1px solid var(--line)}
.desk .chrome i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.desk .cols{display:grid;grid-template-columns:270px 1fr 250px;font-size:13px}
.desk .col{padding:18px;display:flex;flex-direction:column;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.drag{transform:rotate(-2deg);box-shadow:0 14px 28px -12px rgba(20,40,50,.6)}
@media (prefers-reduced-motion:no-preference){a,.btn{transition:opacity .15s}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){nav ol{columns:1}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.head p{color:var(--muted)}
.modes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{font:600 13px var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--night);color:var(--on-night)}
.walk{display:grid;grid-template-columns:240px 316px 1fr;gap:28px;align-items:start}
.flow{display:flex;flex-direction:column;gap:14px}
.flow .grp{display:flex;flex-direction:column;gap:4px}
.flow .lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:10px}
.flow button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;font-size:13px;color:var(--ink)}
.flow button .n{font:600 11px var(--f-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.flow button[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.flow button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.flow button:focus-visible{outline:2px solid var(--accent)}
.stage{display:flex;flex-direction:column;gap:14px;align-items:center}
.who{font:600 12px var(--f-body);padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.who.org{color:var(--accent)}.who.fr{color:var(--claim)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:440px}
.side .step{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.side h2{font-size:26px;letter-spacing:-.01em}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.side .rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.side .rule b{font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav button{font:600 13px var(--f-body);padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.nav button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nav button:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted)}
[data-next]{cursor:pointer}
[data-next]:hover{filter:brightness(1.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 20px;justify-items:center}
.grid figure{display:flex;flex-direction:column;gap:10px;width:300px;max-width:100%}
.grid figcaption{font-size:13px;color:var(--muted)}
.grid figcaption b{color:var(--ink)}
.cam{background:#0b090d;color:#fff}
.cam .sbar{color:#fff}
.receipt{background:#fbfaf7;color:#222;border-radius:6px;width:170px;margin:0 auto;padding:14px 12px;font:9px/1.5 var(--f-mono);transform:rotate(-3deg);box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}
.receipt .r{display:flex;justify-content:space-between}
.corners{position:relative;padding:22px;margin:0 auto}
.corners i{position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid}
.corners i:nth-child(1){top:0;left:0;border-width:3px 0 0 3px;border-radius:8px 0 0 0}
.corners i:nth-child(2){top:0;right:0;border-width:3px 3px 0 0;border-radius:0 8px 0 0}
.corners i:nth-child(3){bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 8px}
.corners i:nth-child(4){bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 8px 0}
.shutter{width:66px;height:66px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;margin:0 auto}
.shutter span{width:50px;height:50px;border-radius:50%;background:#fff}
.ring{width:90px;height:90px;border-radius:50%;border:6px solid var(--accent-soft);border-top-color:var(--accent);margin:24px auto 8px}
@media (prefers-reduced-motion:no-preference){.ring{animation:spin 1.1s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted)}
.field .input{color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick .p{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-line);font-size:11px;font-weight:500}
.pick .p.sel{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent)}
.check{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;flex:0 0 auto}
.check.off{background:transparent;border:1.5px solid var(--line);color:transparent}
@media (max-width:980px){.walk{grid-template-columns:1fr;justify-items:center}.flow{flex-direction:row;overflow-x:auto;width:100%;gap:8px;padding-bottom:6px}.flow .grp{flex-direction:row;flex:0 0 auto}.flow .lbl{display:none}.flow button .t{display:none}.side{max-width:560px;width:100%}}
</style>
<div class="app">
  <div class="head">
    <div><h1>Receipt Splitter, end to end</h1><p>One dinner from first visit to settled, plus an ending with a second receipt. Tap the highlighted button on each screen, use Next, or press ← →.</p></div>
    <div class="modes" role="group" aria-label="View"><button id="m-walk" aria-pressed="true">Walkthrough</button><button id="m-grid" aria-pressed="false">All screens</button></div>
  </div>
  <div class="walk" id="walk">
    <nav class="flow" id="flow" aria-label="Steps"></nav>
    <div class="stage"><span class="who" id="who"></span><div class="phone"><div class="scr" id="screen"></div></div></div>
    <div class="side">
      <span class="step" id="stepno"></span>
      <h2 id="stitle"></h2>
      <ul id="snotes"></ul>
      <div class="rule" id="srule" hidden><b>Rule behind it</b><span id="sruletext"></span></div>
      <div class="nav"><button id="prev">← Back</button><button id="next" class="go">Next →</button></div>
      <p class="hint">Sample data: the bundled Ramen Nagi receipt with made-up names. Ana organizes, Ben is a friend.</p>
    </div>
  </div>
  <div class="grid" id="grid" hidden></div>
</div>

<script>
const I={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M9 7h8v8"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'

const $=id=>document.getElementById(id);
let cur=0;
function render(){
  const s=S[cur];
  $('screen').innerHTML=s.html;
  $('who').textContent=s.track==='Organizer'?'Ana · organizer':s.track==='Friend'?'Ben · friend':s.track==='Senior'?'Example · senior discount':'Alternate ending';
  $('who').className='who '+(s.track==='Friend'?'fr':'org');
  $('stepno').textContent=`Step ${cur+1} of ${S.length} · ${s.track}`;
  $('stitle').textContent=s.title;
  $('snotes').innerHTML=s.notes.map(n=>`<li>${n}</li>`).join('');
  $('srule').hidden=!s.rule; $('sruletext').textContent=s.rule||'';
  $('prev').disabled=cur===0;
  $('next').textContent=cur===S.length-1?'Start over ↺':'Next →';
  document.querySelectorAll('#flow button').forEach((b,i)=>{if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  const a=document.querySelector('#flow button[aria-current]'); if(a&&window.innerWidth<980)a.scrollIntoView({block:'nearest',inline:'center'});
  try{localStorage.setItem('rs-step',cur)}catch(e){}
}
function go(i){cur=(i+S.length)%S.length;render()}
// flow list grouped by consecutive track
(function(){
  const flow=$('flow');let grp=null,last=null;
  S.forEach((s,i)=>{
    if(s.track!==last){grp=document.createElement('div');grp.className='grp';grp.innerHTML=`<span class="lbl">${s.track==='Organizer'?'Ana, organizer':s.track==='Friend'?'Ben, friend':s.track==='Senior'?'Example: senior or PWD':'Alternate: two receipts'}</span>`;flow.appendChild(grp);last=s.track}
    const b=document.createElement('button');b.innerHTML=`<span class="n">${i+1}</span><span class="t">${s.title}</span>`;b.onclick=()=>go(i);b.setAttribute('aria-label',`Step ${i+1}: ${s.title}`);grp.appendChild(b);
  });
  $('grid').innerHTML=S.map((s,i)=>`<figure><div class="phone"><div class="scr">${s.html}</div></div><figcaption><b>${i+1}. ${s.title}</b> · ${s.track==='Organizer'?'Ana':s.track==='Friend'?'Ben':s.track==='Senior'?'Senior example':'Alternate ending'}</figcaption></figure>`).join('');
})();
$('screen').addEventListener('click',e=>{const t=e.target.closest('[data-next]');if(!t)return;const v=t.getAttribute('data-next');go(v===''?cur+1:+v)});
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if($('walk').hidden)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function mode(grid){$('walk').hidden=grid;$('grid').hidden=!grid;$('m-walk').setAttribute('aria-pressed',!grid);$('m-grid').setAttribute('aria-pressed',grid)}
$('m-walk').onclick=()=>mode(false);$('m-grid').onclick=()=>mode(true);
try{const v=+localStorage.getItem('rs-step');if(v>0&&v<S.length)cur=v}catch(e){}
render();
</script>
