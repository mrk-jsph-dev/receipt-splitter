<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Splitter architecture</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d11; color: #e6e9ef; font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 16px 40px; }
  .card { position: relative; border-radius: 18px; overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  .controls { position: absolute; top: 2.2%; right: 2.4%; display: flex; gap: 10px; }
  button { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e6e9ef; background: #1b1f27; border: 1.5px solid #3a404c; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:hover, button[aria-pressed="true"] { border-color: #2dd4bf; }
  #caption { min-height: 3em; margin: 16px 4px 0; font-size: 18px; color: #c9ced8; }
  .n { cursor: pointer; transition: opacity .3s; outline: none; }
  .n:focus-visible rect { stroke-width: 4; }
  .e { transition: opacity .3s; }
  .dim { opacity: .15; }
  .flow { animation-play-state: paused; opacity: 0; }
  .live .flow { animation-play-state: running; opacity: .9; }
  .live .dot { opacity: 1; }
  @media (max-width: 640px) { .controls { position: static; justify-content: flex-end; margin-bottom: 10px; } }
  @media (prefers-reduced-motion: reduce) { .live .dot { opacity: 0; } }
</style>
</head>
<body>
<main>

      <button id="all" type="button">Show all</button>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 760" width="1380" height="760" role="img" aria-label="Receipt Splitter architecture" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>

<marker id="a-host" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
<marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
<marker id="a-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
<marker id="a-deploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#facc15"/></marker>

</style>

<path class="flow" d="M830,350 L945,350 L945,220 L1060,220" stroke="#2dd4bf"/>
<circle class="dot" r="5" fill="#2dd4bf" opacity="0"><animateMotion dur="1.6s" repeatCount="indefinite" path="M830,350 L945,350 L945,220 L1060,220"/></circle>
<rect x="855" y="270" width="181" height="30" rx="15" fill="#12151b" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="945" y="290" text-anchor="middle" class="mono" font-size="14" fill="#e6e9ef">bills, ETag checks</text>

<path class="flow" d="M830,380 L1060,380" stroke="#2dd4bf"/>
<circle class="dot" r="5" fill="#2dd4bf" opacity="0"><animateMotion dur="1.6s" repeatCount="indefinite" path="M830,380 L1060,380"/></circle>
<rect x="859" y="365" width="172" height="30" rx="15" fill="#12151b" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="945" y="385" text-anchor="middle" class="mono" font-size="14" fill="#e6e9ef">photo, not stored</text>
</g>

<path class="flow" d="M320,610 L550,610" stroke="#facc15"/>
<circle class="dot" r="5" fill="#facc15" opacity="0"><animateMotion dur="1.6s" repeatCount="indefinite" path="M320,610 L550,610"/></circle>
<rect x="379" y="595" width="112" height="30" rx="15" fill="#12151b" stroke="#facc15" stroke-width="1.5"/>
<text x="435" y="615" text-anchor="middle" class="mono" font-size="14" fill="#e6e9ef">push image</text>
</g>
<g class="e" id="e6" data-from="ghcr" data-to="api">
<path class="edge" d="M690,560 L690,430" stroke="#facc15" stroke-opacity=".55" marker-end="url(#a-deploy)"/>
<path class="flow" d="M690,560 L690,430" stroke="#facc15"/>
<circle class="dot" r="5" fill="#facc15" opacity="0"><animateMotion dur="1.6s" repeatCount="indefinite" path="M690,560 L690,430"/></circle>
<rect x="634" y="480" width="112" height="30" rx="15" fill="#12151b" stroke="#facc15" stroke-width="1.5"/>
<text x="690" y="500" text-anchor="middle" class="mono" font-size="14" fill="#e6e9ef">pull image</text>
</g>
<g class="e" id="e7" data-from="kill" data-to="api">
<path class="edge" d="M1060,570 L965,570 L965,410 L830,410" stroke="#f87171" stroke-opacity=".55" marker-end="url(#a-guard)"/>
<path class="flow" d="M1060,570 L965,570 L965,410 L830,410" stroke="#f87171"/>
<circle class="dot" r="5" fill="#f87171" opacity="0"><animateMotion dur="1.6s" repeatCount="indefinite" path="M1060,570 L965,570 L965,410 L830,410"/></circle>
<rect x="896" y="475" width="138" height="30" rx="15" fill="#12151b" stroke="#f87171" stroke-width="1.5"/>
<text x="965" y="495" text-anchor="middle" class="mono" font-size="14" fill="#e6e9ef">stops at 100%</text>
</g>
<g class="n" id="n-browser" data-id="browser" tabindex="0">
<rect x="40" y="250" width="280" height="100" rx="12" fill="#1b1f27" stroke="#60a5fa" stroke-width="2.5"/>
<circle cx="64" cy="277" r="5" fill="#60a5fa"/>
<text x="78" y="282" class="mono" font-size="14" letter-spacing="1.5" fill="#60a5fa">VISITOR</text>
<text x="60" y="312" font-size="22" font-weight="600" fill="#f3f5f8">Browser</text>
<text x="60" y="336" font-size="16" fill="#aab1bd">phone, tablet, desktop</text>
</g>
<g class="n" id="n-swa" data-id="swa" tabindex="0">
<rect x="550" y="90" width="280" height="100" rx="12" fill="#1b1f27" stroke="#2dd4bf" stroke-width="2.5"/>
<circle cx="574" cy="117" r="5" fill="#2dd4bf"/>
<text x="588" y="122" class="mono" font-size="14" letter-spacing="1.5" fill="#2dd4bf">HOST</text>
<text x="570" y="152" font-size="22" font-weight="600" fill="#f3f5f8">Static Web Apps</text>
<text x="570" y="176" font-size="16" fill="#aab1bd">Vue 3 app, Free plan</text>
</g>
<g class="n" id="n-api" data-id="api" tabindex="0">
<rect x="550" y="330" width="280" height="100" rx="12" fill="#1b1f27" stroke="#2dd4bf" stroke-width="2.5"/>
<circle cx="574" cy="357" r="5" fill="#2dd4bf"/>
<text x="588" y="362" class="mono" font-size="14" letter-spacing="1.5" fill="#2dd4bf">API</text>
<text x="570" y="392" font-size="22" font-weight="600" fill="#f3f5f8">Container Apps</text>
<text x="570" y="416" font-size="16" fill="#aab1bd">.NET 10 minimal API</text>
</g>
<g class="n" id="n-blob" data-id="blob" tabindex="0">
<rect x="1060" y="170" width="280" height="100" rx="12" fill="#1b1f27" stroke="#a78bfa" stroke-width="2.5"/>
<circle cx="1084" cy="197" r="5" fill="#a78bfa"/>
<text x="1098" y="202" class="mono" font-size="14" letter-spacing="1.5" fill="#a78bfa">DATA</text>
<text x="1080" y="232" font-size="22" font-weight="600" fill="#f3f5f8">Blob Storage</text>
<text x="1080" y="256" font-size="16" fill="#aab1bd">one JSON blob per bill</text>
</g>
<g class="n" id="n-di" data-id="di" tabindex="0">
<rect x="1060" y="330" width="280" height="100" rx="12" fill="#1b1f27" stroke="#fb923c" stroke-width="2.5"/>
<circle cx="1084" cy="357" r="5" fill="#fb923c"/>
<text x="1098" y="362" class="mono" font-size="14" letter-spacing="1.5" fill="#fb923c">SCAN</text>
<text x="1080" y="392" font-size="22" font-weight="600" fill="#f3f5f8">Document Intelligence</text>
<text x="1080" y="416" font-size="16" fill="#aab1bd">receipt model, F0</text>
</g>
<g class="n" id="n-kill" data-id="kill" tabindex="0">
<rect x="1060" y="520" width="280" height="100" rx="12" fill="#1b1f27" stroke="#f87171" stroke-width="2.5"/>
<circle cx="1084" cy="547" r="5" fill="#f87171"/>
<text x="1098" y="552" class="mono" font-size="14" letter-spacing="1.5" fill="#f87171">COST GUARD</text>

</g>

<text x="60" y="646" font-size="16" fill="#aab1bd">tests, Bicep, web upload</text>

<circle cx="574" cy="587" r="5" fill="#facc15"/>
<text x="588" y="592" class="mono" font-size="14" letter-spacing="1.5" fill="#facc15">IMAGE</text>
<text x="570" y="622" font-size="22" font-weight="600" fill="#f3f5f8">Container Registry</text>

  </div>
  <p id="caption" aria-live="polite">Press Play to follow a bill step by step, or tap a box.</p>
</main>
<script>
const DATA = {"nodes": {"browser": {"title": "Browser", "detail": "Anyone with the link. No account and no app to install. Friends tap what they had; the browser never calculates money."}, "swa": {"title": "Static Web Apps", "detail": "Serves the built Vue app. Free plan, so hosting costs nothing. Sends noindex and no-referrer headers."}, "api": {"title": "Container Apps", "detail": "Owns all money maths and returns computed breakdowns. Consumption plan, 0 to 1 replicas, so it sleeps when nobody uses it. Rate limits and daily caps on creates and scans."}, "blob": {"title": "Blob Storage", "detail": "Each bill is one JSON blob. ETag checks stop two people from overwriting each other. A lifecycle rule deletes bills 30 days after the last change."}, "di": {"title": "Document Intelligence", "detail": "Reads receipt photos on the free F0 tier. The photo stays in memory for one request, and the API asks for it to be deleted right after."}, "kill": {"title": "Budget + kill switch", "detail": "A $1 monthly budget. When actual spend passes 100%, an action group runs a runbook that stops the API until someone turns it back on."}, "actions": {"title": "GitHub Actions", "detail": "One manual workflow. Tests run first; deploys sign in to Azure with OIDC, so no keys are stored."}, "ghcr": {"title": "Container Registry", "detail": "The API image, tagged with its commit. Public, so Azure pulls it with no credential."}}, "steps": [{"edges": ["e1"], "nodes": ["browser", "swa"], "text": "1 \u00b7 A friend opens the link. Static Web Apps serves the Vue app."}, {"edges": ["e2"], "nodes": ["browser", "api"], "text": "2 \u00b7 Every claim is a small JSON call to the API, which returns the bill and its computed breakdown."}, {"edges": ["e3"], "nodes": ["api", "blob"], "text": "3 \u00b7 The API saves the bill as one JSON blob. ETag checks stop two people overwriting each other."}, {"edges": ["e4"], "nodes": ["api", "di"], "text": "4 \u00b7 Scanning sends the photo to Document Intelligence. It is never stored."}, {"edges": ["e5", "e6"], "nodes": ["actions", "ghcr", "api"], "text": "5 \u00b7 A manual deploy runs the tests, pushes the image, and the API pulls it."}, {"edges": ["e7"], "nodes": ["kill", "api"], "text": "6 \u00b7 If spend ever passes the $1 budget, the kill switch stops the API."}]};
const svg = document.querySelector('svg');
const nodes = [...svg.querySelectorAll('.n')];
const edges = [...svg.querySelectorAll('.e')];
const caption = document.getElementById('caption');
const playBtn = document.getElementById('play');
let timer = null;

function focusOn(edgeIds, nodeIds, text) {
  edges.forEach(e => { const on = edgeIds.includes(e.id); e.classList.toggle('dim', !on); e.classList.toggle('live', on); });
  nodes.forEach(n => n.classList.toggle('dim', !nodeIds.includes(n.dataset.id)));
  caption.textContent = text;
}
function showAll() {
  stop();
  edges.forEach(e => { e.classList.remove('dim'); e.classList.add('live'); });
  nodes.forEach(n => n.classList.remove('dim'));
  caption.textContent = 'Every part at once. Tap a box to see what it does.';
}
function stop() { clearTimeout(timer); timer = null; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-pressed', 'false'); }
function play(i = 0) {
  playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'true');
  const s = DATA.steps[i];
  focusOn(s.edges, s.nodes, s.text);
  timer = setTimeout(() => i + 1 < DATA.steps.length ? play(i + 1) : (stop(), showAll()), 3200);
}
playBtn.addEventListener('click', () => timer ? stop() : play());
document.getElementById('all').addEventListener('click', showAll);
nodes.forEach(n => {
  const pick = () => {
    stop();
    const id = n.dataset.id;
    const linked = edges.filter(e => e.dataset.from === id || e.dataset.to === id);
    const ids = new Set([id]); linked.forEach(e => { ids.add(e.dataset.from); ids.add(e.dataset.to); });
    focusOn(linked.map(e => e.id), [...ids], DATA.nodes[id].title + ' · ' + DATA.nodes[id].detail);
  };
  n.addEventListener('click', pick);
  n.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
});
showAll();
caption.textContent = 'Press Play to follow a bill step by step, or tap a box.';
</script>
</body>
</html>
